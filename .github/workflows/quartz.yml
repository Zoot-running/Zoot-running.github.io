name: Deploy Quartz to GitHub Pages
on:
  push:
    branches: [v4]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 确保拉取完整历史（Quartz 需用到）

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Quartz site（输出到 public 目录）
        run: npx quartz build  # 按配置输出到 public 目录

      - name: Upload build artifacts（仅上传构建产物）
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public  # 只上传 public 目录（含 index.html、笔记等）

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages（官方组件，稳定无错）
        id: deployment
        uses: actions/deploy-pages@v4