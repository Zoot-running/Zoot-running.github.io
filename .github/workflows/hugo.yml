name: Build and Deploy Quartz Site

# 触发条件：当代码推送到 v4 分支时
on:
  push:
    branches: [ v4 ]
  # 可选：允许手动触发
  workflow_dispatch:

# 定义一个名为 build 的任务
jobs:
  build:
    # 在最新版的 Ubuntu 系统上运行
    runs-on: ubuntu-latest

    steps:
      # 第一步：检出仓库代码
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # 确保 Hugo 主题等子模块也被一并检出
          submodules: true
          fetch-depth: 0

      # 第二步：安装 Hugo
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # 指定 Hugo 版本，使用 'latest' 获取最新版
          hugo-version: 'latest'
          # Quartz v4 需要 Hugo 扩展版
          extended: true

      # 第三步：构建静态站点
      - name: Build Site with Hugo
        run: hugo --minify
        # 构建结果会默认输出到仓库根目录的 'public' 文件夹

      # 第四步：部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          # 使用 GitHub 提供的默认令牌进行认证
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 指定要部署的文件夹，即 Hugo 构建输出的 'public' 文件夹
          publish_dir: ./public
          # 指定部署到 'gh-pages' 分支
          publish_branch: gh-pages